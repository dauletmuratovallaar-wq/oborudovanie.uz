<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#777);--btn:var(--tg-theme-button-color,#2481cc);--btx:var(--tg-theme-button-text-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#f3f4f6)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:90px}
h2{margin:18px 12px 8px;font-size:18px}
.card{display:flex;gap:10px;align-items:center;background:var(--sec);margin:8px 12px;padding:12px;border-radius:12px}
.card img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.info{flex:1}.name{font-weight:600}.price{color:var(--hint);font-size:14px;margin-top:2px}
.qty{display:flex;align-items:center;gap:8px}
button{border:0;border-radius:8px;background:var(--btn);color:var(--btx);font-size:18px;min-width:36px;height:36px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px;background:var(--bg)}
#bar button{width:100%;height:48px;font-size:16px}
#form{display:none;padding:12px}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid var(--hint);border-radius:8px;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
</style></head><body>
<div id="list"></div>
<div id="form"><h2>Buyurtma</h2><div id="sum"></div>
<input id="phone" type="tel" placeholder="Telefon raqami (+998...)">
<textarea id="note" rows="2" placeholder="Manzil yoki izoh (ixtiyoriy)"></textarea></div>
<div id="bar"><button id="main">Savatcha bo'sh</button></div>
<script>
const tg=window.Telegram.WebApp,$=id=>document.getElementById(id);
tg.ready();tg.expand();
let cart={},P={},mode="list";
const som=n=>n.toLocaleString("ru-RU")+" so'm";
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const total=()=>Object.entries(cart).reduce((s,[id,q])=>s+(P[id].price_num||0)*q,0);
function draw(id){const q=cart[id]||0;
 $("q-"+id).innerHTML=q?`<button onclick="chg('${id}',-1)">−</button><b>${q}</b><button onclick="chg('${id}',1)">+</button>`:`<button onclick="chg('${id}',1)">+</button>`;}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];draw(id);upd();}
function upd(){const n=count(),t=total(),tail=n?` ${n} ta`+(t?" · "+som(t):""):"";
 $("main").textContent=mode=="list"?(n?"Savatcha:"+tail+" →":"Savatcha bo'sh"):"Buyurtma berish";
 $("sum").textContent=n?"Jami:"+tail:"";}
function show(m){mode=m;$("list").style.display=m=="list"?"block":"none";$("form").style.display=m=="form"?"block":"none";
 m=="form"?tg.BackButton.show():tg.BackButton.hide();upd();}
tg.BackButton.onClick(()=>show("list"));
$("main").onclick=()=>{
 if(!count())return;
 if(mode=="list")return show("form");
 const phone=$("phone").value.trim();
 if(phone.replace(/\D/g,"").length<7)return tg.showAlert("Telefon raqamini kiriting");
 tg.sendData(JSON.stringify({items:cart,phone:phone,note:$("note").value.trim()}));};
fetch("catalog.json").then(r=>r.json()).then(c=>{
 c.categories.forEach(cat=>{
  $("list").insertAdjacentHTML("beforeend",`<h2>${cat.name}</h2>`);
  cat.products.forEach(p=>{P[p.id]=p;
   $("list").insertAdjacentHTML("beforeend",`<div class="card">${p.photo?`<img src="photos/${p.photo}" alt="">`:""}<div class="info"><div class="name">${p.name}</div><div class="price">${p.price}</div></div><div class="qty" id="q-${p.id}"></div></div>`);
   draw(p.id);});});
}).catch(()=>{$("list").textContent="Katalog yuklanmadi";});
</script></body></html>
