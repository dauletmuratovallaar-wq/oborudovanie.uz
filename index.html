<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#777);--btn:var(--tg-theme-button-color,#2481cc);--btx:var(--tg-theme-button-text-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#f3f4f6)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:90px}
h2{margin:18px 12px 8px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.card{background:var(--sec);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:40px}
.ph img{width:100%;height:100%;object-fit:contain}
.cb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:600;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{color:var(--hint);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:6px}
button,.btn{border:0;border-radius:10px;background:var(--btn);color:var(--btx);font:600 16px system-ui,sans-serif;min-width:38px;height:38px;padding:0 14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.q{display:flex;align-items:center;gap:8px}
.big{display:flex;gap:12px;align-items:center;justify-content:center}
.big>button:only-child{flex:1;height:48px}
#detail{display:none}
.dph{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:64px}
.dph img{width:100%;height:100%;object-fit:contain}
.dp{padding:14px 12px}
.cat{color:var(--btn);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
h1{font-size:22px;margin:6px 0}
.dprice{font-size:24px;font-weight:700;margin:6px 0 14px}
.acts{display:flex;gap:10px;margin:12px 0}
.acts .btn{flex:1;height:46px;background:var(--sec);color:var(--tx)}
.info{white-space:pre-line;background:var(--sec);border-radius:12px;padding:12px;margin:14px 0}
table{width:100%;border-collapse:collapse}
td{padding:10px 12px;border-bottom:1px solid var(--sec)}td:first-child{color:var(--hint)}td:last-child{text-align:right;font-weight:600}
h3{margin:18px 0 8px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px;background:var(--bg)}
#bar button{width:100%;height:48px}
#form{display:none;padding:12px}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid var(--hint);border-radius:8px;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
</style></head><body>
<div id="list"></div>
<div id="detail"></div>
<div id="form"><h2>Buyurtma</h2><div id="sum"></div>
<input id="phone" type="tel" placeholder="Telefon raqami (+998...)">
<textarea id="note" rows="2" placeholder="Manzil yoki izoh (ixtiyoriy)"></textarea></div>
<div id="bar"><button id="main">Savatcha bo'sh</button></div>
<script>
const tg=window.Telegram.WebApp,$=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
tg.ready();tg.expand();
let cart={},P={},CFG={},PERKS=[],mode="list",from="list";
const som=n=>n.toLocaleString("ru-RU")+" so'm";
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const total=()=>Object.entries(cart).reduce((s,[id,q])=>s+(P[id].price_num||0)*q,0);
function draw(id){document.querySelectorAll('[data-q="'+id+'"]').forEach(el=>{
 const q=cart[id]||0,big=el.classList.contains("big");
 el.innerHTML=q?`<button onclick="event.stopPropagation();chg('${id}',-1)">−</button><b>${q}</b><button onclick="event.stopPropagation();chg('${id}',1)">+</button>`
 :`<button onclick="event.stopPropagation();chg('${id}',1)">${big?"🛒 Savatga qo'shish":"+"}</button>`;});}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];draw(id);upd();}
function upd(){const n=count(),t=total(),tail=n?` ${n} ta`+(t?" · "+som(t):""):"";
 $("main").textContent=mode=="form"?"Buyurtma berish":(n?"Savatcha:"+tail+" →":"Savatcha bo'sh");
 $("sum").textContent=n?"Jami:"+tail:"";}
function show(m){if(m=="form")from=mode;mode=m;
 ["list","detail","form"].forEach(v=>$(v).style.display=v==m?"block":"none");
 m=="list"?tg.BackButton.hide():tg.BackButton.show();window.scrollTo(0,0);upd();}
function openP(id){const p=P[id];
 const specs=(p.specs||[]).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("");
 $("detail").innerHTML=`<div class="dph">${p.photo?`<img src="${esc(p.photo)}" alt="">`:"📷"}</div><div class="dp">
 <div class="cat">${esc(p.cat)}</div><h1>${esc(p.name)}</h1><div class="dprice">${esc(p.price)}</div>
 <div class="big" data-q="${id}"></div>
 <div class="acts">${CFG.phone?`<a class="btn" href="tel:${esc(CFG.phone)}">📞 Qo'ng'iroq</a>`:""}${CFG.telegram?`<a class="btn" href="#" onclick="tg.openTelegramLink('${esc(CFG.telegram)}');return false">✈️ Telegram</a>`:""}</div>
 ${p.info?`<div class="info">${esc(p.info)}</div>`:""}
 ${PERKS.length?`<div class="info">${PERKS.map(x=>"✅ "+esc(x)).join("<br>")}</div>`:""}
 ${specs?`<h3>Xususiyatlari</h3><table>${specs}</table>`:""}</div>`;
 draw(id);show("detail");}
tg.BackButton.onClick(()=>show(mode=="form"?from:"list"));
$("main").onclick=()=>{
 if(!count())return;
 if(mode!="form")return show("form");
 const phone=$("phone").value.trim();
 if(phone.replace(/\D/g,"").length<7)return tg.showAlert("Telefon raqamini kiriting");
 tg.sendData(JSON.stringify({items:cart,phone:phone,note:$("note").value.trim()}));};
fetch("catalog.json").then(r=>r.json()).then(c=>{
 CFG=c.contact||{};PERKS=c.perks||[];
 c.categories.forEach(cat=>{
  let h=`<h2>${esc(cat.name)}</h2><div class="grid">`;
  cat.products.forEach(p=>{p.cat=cat.name;P[p.id]=p;
   h+=`<div class="card" onclick="openP('${p.id}')"><div class="ph">${p.photo?`<img src="${esc(p.photo)}" alt="">`:"📷"}</div>
   <div class="cb"><div class="name">${esc(p.name)}</div><div class="row"><span class="price">${esc(p.price)}</span><span class="q" data-q="${p.id}"></span></div></div></div>`;});
  $("list").insertAdjacentHTML("beforeend",h+"</div>");
  cat.products.forEach(p=>draw(p.id));});
}).catch(()=>{$("list").textContent="Katalog yuklanmadi";});
</script></body></html>
